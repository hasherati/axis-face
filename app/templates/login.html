<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Axis Facial Recognition Server</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center font-sans p-4">

  <div class="w-full max-w-md bg-slate-800 border border-slate-700 rounded-xl shadow-2xl p-6">
    <div class="flex items-center gap-3 mb-6">
      <div class="w-3 h-3 rounded-full bg-indigo-500"></div>
      <h1 class="text-lg font-bold tracking-tight text-white">Axis Facial Recognition Server</h1>
    </div>

    {% if error %}
    <div class="mb-4 bg-red-900/60 border border-red-600 text-red-200 px-3.5 py-2.5 rounded text-xs">
      {{ error }}
    </div>
    {% endif %}

    <form method="post" action="/login" class="space-y-4 text-sm">
      <div>
        <label class="block text-xs text-slate-400 mb-1">Username (<code class="text-slate-300">admin</code> or <code class="text-slate-300">guest</code>)</label>
        <input type="text" name="username" required autofocus
               class="w-full bg-slate-900 border border-slate-600 rounded px-3 py-2 text-white focus:border-indigo-500 focus:outline-none" />
      </div>

      <div>
        <label class="block text-xs text-slate-400 mb-1">Password</label>
        <input type="password" name="password" required
               class="w-full bg-slate-900 border border-slate-600 rounded px-3 py-2 text-white focus:border-indigo-500 focus:outline-none" />
      </div>

      <button type="submit"
              class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2 rounded transition">
        Sign In
      </button>
    </form>
  </div>

</body>
</html>
